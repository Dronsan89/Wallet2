# Локальный стенд кошелька: PostgreSQL + Kafka (KRaft) + сам сервис.
# Образы тянутся из интернета, поэтому в офлайн-окружении сначала `docker pull`,
# либо используйте внешние Postgres/Kafka и запускайте бинарь напрямую.
#
#   docker compose up --build
#
# Сервис курсов (exchanger) в стенд не входит: без него работают все ручки,
# кроме GET /api/v1/exchange/rates и POST /api/v1/exchange.

services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.7.1
    container_name: wallet-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  wallet:
    build:
      context: ..
      dockerfile: gw-currency-wallet/Dockerfile
    container_name: wallet-app
    environment:
      LOG_LEVEL: info
      HTTP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:9092
      EXCHANGER_GRPC_ADDR: exchanger:50051
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  pgdata: